version: '3.8'

services:
  harisco-ticketing:
    build: .
    container_name: harisco-ticketing-system
    ports:
      - '8082:8082'
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8082
      - DB_PATH=/app/data/database.sqlite
      - NODE_ENV=production
      - PYTHON_SERVICE_URL=http://face-api:8000
    restart: unless-stopped
    depends_on:
      - face-api
    networks:
      - app-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8082/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  face-api:
    build: ./python-service
    container_name: harisco-face-api
    volumes:
      - face_data:/app/data
      - deepface_weights:/root/.deepface
    restart: unless-stopped
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ticketing-system-cloudflared-tunnel
    command: tunnel run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      harisco-ticketing:
        condition: service_healthy

volumes:
  face_data:
  deepface_weights:

networks:
  app-network:
    driver: bridge
