version: '3.8'

services:
  harisco-ticketing:
    build: .
    container_name: harisco-ticketing-system
    ports:
      - '8082:8082'
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8082
      - DB_PATH=/app/data/database.sqlite
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8082/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 15s # Checks status every 15 seconds
      timeout: 5s # Must respond within 5 seconds
      retries: 3 # Considers the app dead if it fails 3 consecutive times
      start_period: 5s # Gives the app 5 seconds to boot before checking

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ticketing-system-cloudflared-tunnel
    command: tunnel run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      harisco-ticketing:
        condition: service_healthy
