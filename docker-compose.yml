version: "3.8"

services:
  harisco-ticketing:
    build: .
    container_name: harisco-ticketing-system
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8082
      - DB_PATH=/app/data/database.sqlite
      - NODE_ENV=production
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ticketing-system-cloudflared-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - harisco-ticketing
