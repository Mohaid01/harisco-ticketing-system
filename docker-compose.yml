version: '3.8'

services:
  harisco-ticketing:
    build: .
    container_name: harisco-ticketing-system
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - NODE_ENV=production
      - DB_PATH=/app/data/database.sqlite
    volumes:
      - harisco_db_data:/app/data
    restart: unless-stopped

volumes:
  harisco_db_data:
